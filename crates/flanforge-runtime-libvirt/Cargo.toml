[package]
name = "flanforge-runtime-libvirt"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[target.'cfg(target_os = "linux")'.dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
fatfs = { version = "0.3.6", default-features = false, features = ["std", "alloc"] }
flanforge-core = { workspace = true }
flanforge-forgejo = { workspace = true }
flanforge-libvirt-wire = { workspace = true }
flanforge-manager = { workspace = true }
flanforge-paths = { workspace = true }
flanforge-runtime = { workspace = true }
flanforge-store = { workspace = true }
flanforge-utils = { workspace = true }
flanforge-wire = { workspace = true }
fs2 = { workspace = true }
rand_core = { version = "0.6.4", features = ["getrandom"] }
roxmltree = "0.20.0"
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9.34"
sha2 = { workspace = true }
ssh-key = { version = "0.6.7", features = ["ed25519", "encryption", "rand_core"] }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
virt = { version = "=0.4.3", features = ["qemu"] }
libc = "0.2"

[target.'cfg(target_os = "linux")'.dev-dependencies]
flanforge-test-support = { workspace = true }
tempfile = "3"

[lints]
workspace = true
