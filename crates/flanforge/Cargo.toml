[package]
name = "flanforge"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "flanforged"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
flanforge-auth = { workspace = true }
flanforge-cli = { workspace = true }
flanforge-commands = { workspace = true }
flanforge-config = { workspace = true }
flanforge-core = { workspace = true }
flanforge-forgejo = { workspace = true }
flanforge-logging = { workspace = true }
flanforge-handlers = { workspace = true }
flanforge-manager = { workspace = true }
flanforge-router = { workspace = true }
flanforge-webui-auth = { workspace = true }
flanforge-webui-routes = { workspace = true }
flanforge-routes = { workspace = true }
flanforge-runtime = { workspace = true }
flanforge-migrations = { workspace = true }
flanforge-orm = { workspace = true }
sea-orm = { workspace = true }
flanforge-store = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
flanforge-runtime-tart = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
flanforge-runtime-libvirt = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
flanforge-test-support = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
toml = { workspace = true }
tower = { workspace = true }

[lints]
workspace = true
